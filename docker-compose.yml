services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: sde_tracker
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - tracker_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sde_tracker"]
      interval: 2s
      timeout: 5s
      retries: 20

volumes:
  tracker_pg:
